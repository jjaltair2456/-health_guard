{% extends 'base.html' %}

{% block title %}Iniciar Sesión - HealthGuard{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-8">
        <div class="inline-block p-3 bg-cyan-500/10 text-cyan-400 rounded-full mb-3 text-2xl">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 class="text-2xl font-bold">Acceso Seguro al Expediente</h2>
        <p class="text-sm text-slate-400 mt-1">Ingresa tus credenciales autorizadas</p>
    </div>

    <form method="post" class="space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Correo Electrónico</label>
            {{ form.username }}
        </div>
        <div>
            <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Contraseña</label>
            {{ form.password }}
        </div>
        <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-lg transition-colors shadow-lg shadow-cyan-500/20">
            Ingresar
        </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-800 pt-4">
        ¿No tienes cuenta? <a href="{% url 'authentication:register' %}" class="text-cyan-400 hover:underline">Regístrate aquí</a>
    </div>
</div>
{% endblock %}
